name: UnifiedLogisticsHRDashboard
options:
  bundleIdPrefix: com.trackerapp
  deploymentTarget:
    iOS: "15.0"
targets:
  UnifiedLogisticsHRDashboard:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Unified Logistics HR Claims Dashboard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackerapp.dashboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # No Apple Developer team configured on purpose — this is built
        # unsigned and re-signed later by the user's own sideloading tool
        # (Sideloadly/AltStore) with their free Apple ID, not distributed
        # through the App Store.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
