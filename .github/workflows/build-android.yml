name: Build Android APK

on:
  push:
    branches:
      - claude/windows-exe-install-check-5d4sve
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage APK into installer/android
        run: |
          mkdir -p installer/android
          # remove any previously published APKs so only the latest remains
          find installer/android -maxdepth 1 -name "*.apk" -delete || true
          cp android/app/build/outputs/apk/release/app-release.apk \
            "installer/android/Unified Logistics HR Claims Dashboard ${{ steps.version.outputs.version }}.apk"

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "installer/android"
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "Add built Android APK v${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
